<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HCL Admin - לוח בקרה</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f2937">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="admin-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .tab-btn.active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: bold; background-color: white;}
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .in-progress-stamp { border: 3px solid #f97316; color: #f97316; transform: rotate(-5deg); font-family: 'Impact', sans-serif; }

        .flatpickr-day.has-tasks-dot::after {
            content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
            width: 5px; height: 5px; background-color: #4f46e5; border-radius: 50%;
        }

        @media print {
            @page { size: A4 portrait; margin: 8mm; }
            body { background: white !important; margin: 0; padding: 0 !important; -webkit-print-color-adjust: exact; }
            
            #managerTable { width: 100%; border-collapse: collapse; margin-top: 10mm; direction: rtl; }
            #managerTable th, #managerTable td { border: 1px solid #000; padding: 8px; text-align: right; font-size: 13px; color: #000; }
            #managerTable th { background-color: #e5e7eb !important; font-weight: bold; }
            #printTitleManager { font-size: 24px; font-weight: bold; text-align: center; text-decoration: underline; margin-bottom: 15px; color: #000; }

            .print-page { width: 100%; height: 280mm; page-break-after: always; box-sizing: border-box; display: flex; flex-direction: column; }
            .print-page-header { font-size: 19px; font-weight: bold; text-align: center; border-bottom: 3px solid #000; padding-bottom: 5px; margin-bottom: 8px; height: 40px; display: flex; flex-direction: column; justify-content: center;}
            .print-page-header-sub { font-size: 13px; font-weight: normal; color: #555; margin-top: 2px;}
            
            .print-cards-grid { display: flex; flex-wrap: wrap; justify-content: space-between; align-content: space-between; flex-grow: 1; height: calc(100% - 50px); }
            
            .print-card { width: 48.8%; height: 49%; border: 2px solid #000; border-radius: 10px; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; page-break-inside: avoid; overflow: hidden; }
            .print-card-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 4px; margin-bottom: 8px; }
            .print-card-body { display: flex; gap: 10px; flex-grow: 1; align-items: stretch; overflow: hidden; }
            .print-photo { width: 68%; height: 100%; max-height: 380px; object-fit: cover; border: 2px solid #cbd5e1; border-radius: 8px; }
            .print-info { width: 32%; display: flex; flex-direction: column; }
            .defect-title { font-size: 18px; font-weight: 900; margin-bottom: 6px; line-height: 1.2; }
            .defect-comment { font-size: 14px; color: #374151; line-height: 1.2; }
            
            .signature-box { border-top: 2px dashed #000; margin-top: 8px; padding-top: 6px; display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; }
        }
    </style>
</head>
<body class="text-gray-800">

    <div id="toastContainer" class="fixed bottom-5 left-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <div id="customConfirmModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4 transition-all duration-300 opacity-0">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl transform scale-95 transition-all duration-300 text-center">
            <div id="confirmIconContainer" class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
                <i class="fas fa-question-circle"></i>
            </div>
            <h3 id="confirmTitle" class="text-xl font-black text-gray-800 mb-2"></h3>
            <p id="confirmMessage" class="text-gray-500 font-medium mb-6 text-sm leading-relaxed"></p>
            <div class="flex gap-3">
                <button id="confirmCancelBtn" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl font-bold transition-colors">ביטול</button>
                <button id="confirmSuccessBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold transition-colors shadow-md">אישור</button>
            </div>
        </div>
    </div>

    <div id="loginScreen" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center">
            <i class="fas fa-lock text-indigo-600 text-5xl mb-4"></i>
            <h2 class="text-2xl font-black mb-6">כניסת מנהל</h2>
            <input type="password" id="pinCode" placeholder="קוד גישה" class="w-full p-4 mb-4 bg-gray-50 border rounded-xl text-center text-2xl font-bold tracking-widest outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="checkPin()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg">כניסה</button>
            <p id="pinError" class="text-red-500 font-bold mt-2 hidden">קוד שגוי!</p>
        </div>
    </div>

    <div id="loader" class="fixed inset-0 bg-white/90 hidden z-40 flex items-center justify-center">
        <div class="flex flex-col items-center"><div class="loader mb-4"></div><p class="font-bold text-indigo-600" id="loaderText">معדכן נתונים...</p></div>
    </div>

    <div id="workersModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-xl font-black text-gray-800"><i class="fas fa-users-cog text-indigo-600 ml-2"></i>ניהול רשימת עובדים</h3>
                <button onclick="closeWorkersModal()" class="text-gray-400 hover:text-gray-600 text-xl"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex gap-2 mb-4">
                <input type="text" id="newWorkerName" placeholder="שם עובד חדש" class="flex-grow p-3 bg-gray-50 border rounded-xl font-bold outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="addWorkerToList()" class="bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold hover:bg-indigo-500"><i class="fas fa-plus"></i></button>
            </div>
            <div id="workersListZone" class="flex-grow overflow-y-auto space-y-2 mb-4 pr-1"></div>
            <button onclick="saveWorkersToServer()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-500 shadow"><i class="fas fa-save ml-2"></i>שמור שינויים בטבלה</button>
        </div>
    </div>

    <button id="backToTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fixed bottom-6 right-6 bg-indigo-600 text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center hover:bg-indigo-500 transition-all z-30 opacity-0 invisible">
        <i class="fas fa-arrow-up text-lg"></i>
    </button>

    <div id="mainApp" class="hidden max-w-5xl mx-auto p-4 md:p-6 print:p-0 print:max-w-full">
        <div id="noPrintUI">
            <div id="unprintedAlertBanner" class="hidden mb-6">
                <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                    <button onclick="toggleBannerDetails()" class="w-full flex justify-between items-center p-4 bg-gray-50 hover:bg-gray-100 transition-colors border-b border-gray-200 outline-none">
                        <div class="flex items-center gap-3 font-bold text-gray-800" id="bannerSummaryText"></div>
                        <i id="bannerChevron" class="fas fa-chevron-down text-gray-500 transition-transform duration-300"></i>
                    </button>
                    <div id="bannerDetails" class="hidden p-4 bg-white text-sm">
                        <div id="unprintedAlertText" class="w-full"></div>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-6">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 border-b pb-4">
                    <h1 class="text-3xl font-black text-gray-800 mb-4 md:mb-0">לוח בקרה <span class="text-indigo-600">HCL</span></h1>
                    <div class="flex gap-2 flex-wrap justify-center items-center">
                        <button onclick="openWorkersModal()" class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-xl font-bold hover:bg-indigo-100 shadow"><i class="fas fa-users ml-2"></i>ניהול עובדים</button>
                        <button onclick="toggleSelectAll()" id="selectAllBtn" class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-xl font-bold hover:bg-indigo-100 shadow"><i class="fas fa-check-square ml-2"></i>בחר הכל</button>
                        <button onclick="closeSelectedTasks()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-indigo-500 shadow"><i class="fas fa-check-double ml-2"></i>סגור נבחרים</button>
                        
                        <div class="flex items-center bg-orange-50 border border-orange-200 rounded-xl overflow-hidden shadow flex-wrap md:flex-nowrap">
                            <select id="printWorker" class="bg-transparent text-orange-900 py-2 px-3 font-bold outline-none border-l border-orange-200 text-sm max-w-[140px]">
                                <option value="">בחר עובד... (Без мастера)</option>
                            </select>
                            <select id="printLang" class="bg-transparent text-orange-900 py-2 px-3 font-bold outline-none text-sm">
                                <option value="he">🇮🇱 עברית</option>
                                <option value="ru">🇷🇺 Русский</option>
                                <option value="ar">🇦🇪 العربية</option>
                            </select>
                            <button onclick="printTasks()" class="bg-orange-600 text-white px-5 py-2 font-bold hover:bg-orange-500 transition-colors">
                                <i class="fas fa-print ml-2"></i>הדפס
                            </button>
                        </div>
                        
                        <button onclick="printManagerReport()" class="bg-green-600 text-white px-5 py-2 rounded-xl font-bold hover:bg-green-500 shadow"><i class="fas fa-table ml-2"></i>דוח מנהל</button>
                        <button onclick="loadTasks()" class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-xl font-bold hover:bg-indigo-200"><i class="fas fa-sync-alt"></i></button>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-bold text-gray-500 mb-1">מחלקה</label>
                        <select id="filterDept" onchange="renderTasks()" class="w-full p-3 bg-gray-50 border rounded-xl font-bold outline-none">
                            <option value="ALL">כל המחלקות</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-bold text-gray-500 mb-1">מתאריך</label>
                        <input type="text" id="filterDate" class="w-full p-3 bg-gray-50 border rounded-xl font-bold outline-none" placeholder="בחר תאריך">
                    </div>
                    <div class="flex items-end">
                        <button onclick="resetFilters()" class="px-6 py-3 bg-red-100 text-red-600 rounded-xl font-bold">נקה סינון</button>
                    </div>
                </div>
            </div>

            <div class="flex bg-white rounded-2xl shadow-sm mb-6 overflow-hidden flex-wrap md:flex-nowrap border border-gray-200">
                <button onclick="switchTab('חשמל')" id="tab-חשמל" class="tab-btn active flex-1 py-4 px-2 font-bold text-gray-500">חשמל</button>
                <button onclick="switchTab('מיזוג_אוויר')" id="tab-מיזוג_אוויר" class="tab-btn flex-1 py-4 px-2 font-bold text-gray-500">מיזוג</button>
                <button onclick="switchTab('בינוי_ודלתות')" id="tab-בינוי_ודלתות" class="tab-btn flex-1 py-4 px-2 font-bold text-gray-500">בינוי</button>
                <button onclick="switchTab('מיטות')" id="tab-מיטות" class="tab-btn flex-1 py-4 px-2 font-bold text-gray-500">מיטות</button>
                <button onclick="switchTab('בטיחות')" id="tab-בטיחות" class="tab-btn flex-1 py-4 px-2 font-bold text-gray-500">בטיחות</button>
                <button onclick="switchTab('ניקיון')" id="tab-ניקיון" class="tab-btn flex-1 py-4 px-2 font-bold text-gray-500">ניקיון</button>
                <button onclick="switchTab('ליקויים')" id="tab-ליקויים" class="tab-btn flex-1 py-4 px-2 font-bold text-gray-500">כללי</button>
            </div>

            <div id="screenTasksContainer" class="space-y-4"></div>
        </div>

        <div id="printTitleManager" style="display: none;"></div>
        <table id="managerTable" style="display: none;">
            <thead>
                <tr>
                    <th>תאריך ושעה</th>
                    <th>שם הבודק</th>
                    <th>מחלקה</th>
                    <th>חדר</th>
                    <th>פריט נבדק</th>
                    <th>הערות</th>
                    <th>סטטוס</th>
                </tr>
            </thead>
            <tbody id="managerTableBody"></tbody>
        </table>

        <div id="printTasksContainer" style="display: none;"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxMN6s8ektwhHxuE_8xDz1ZaeqYyXaLyniwi_xFpbzVEjFEo_AUd6PybJk6nGKxmy7E/exec";
        let allTasks = [];
        let workersPool = []; 
        let currentTab = "חשמל";
        let fpInstance = null;

        // Элегантная кастомная система Toast-уведомлений
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-xl shadow-xl font-bold text-sm text-white flex items-center gap-3 transform translate-y-4 opacity-0 transition-all duration-300 pointer-events-auto border`;
            
            let icon = 'fa-check-circle';
            if (type === 'success') { toast.classList.add('bg-emerald-600', 'border-emerald-500'); icon = 'fa-check-circle'; }
            else if (type === 'error') { toast.classList.add('bg-rose-600', 'border-rose-500'); icon = 'fa-exclamation-circle'; }
            else if (type === 'warning') { toast.classList.add('bg-amber-500', 'border-amber-400'); icon = 'fa-exclamation-triangle'; }
            else { toast.classList.add('bg-indigo-600', 'border-indigo-500'); icon = 'fa-info-circle'; }

            toast.innerHTML = `<i class="fas ${icon} text-lg"></i><span class="flex-grow text-right">${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => { toast.classList.remove('translate-y-4', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => { toast.remove(); }, 300);
            }, 3500);
        }

        // Красивое диалоговое окно вместо стандартного window.confirm
        function showCustomConfirm(title, message, onConfirm, iconClass = 'fa-question-circle', confirmText = 'אישור', cancelText = 'ביטול') {
            const modal = document.getElementById('customConfirmModal');
            const box = modal.querySelector('div');
            
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = message;
            document.getElementById('confirmIconContainer').innerHTML = `<i class="fas ${iconClass}"></i>`;
            
            const sBtn = document.getElementById('confirmSuccessBtn');
            const cBtn = document.getElementById('confirmCancelBtn');
            sBtn.innerText = confirmText;
            cBtn.innerText = cancelText;

            if (iconClass.includes('trash') || iconClass.includes('exclamation') || iconClass.includes('warning')) {
                sBtn.className = "flex-1 bg-rose-600 hover:bg-rose-500 text-white py-3 rounded-xl font-bold transition-colors shadow-md";
                document.getElementById('confirmIconContainer').className = "w-16 h-16 bg-rose-50 text-rose-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4";
            } else {
                sBtn.className = "flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold transition-colors shadow-md";
                document.getElementById('confirmIconContainer').className = "w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4";
            }

            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); box.classList.remove('scale-95'); }, 10);

            const close = () => {
                modal.classList.add('opacity-0'); box.classList.add('scale-95');
                setTimeout(() => { modal.classList.add('hidden'); }, 300);
            };
            sBtn.onclick = () => { close(); if(onConfirm) onConfirm(); };
            cBtn.onclick = () => { close(); };
        }

        window.addEventListener('scroll', () => {
            const btn = document.getElementById('backToTopBtn');
            if (window.scrollY > 300) { btn.classList.remove('opacity-0', 'invisible'); } 
            else { btn.classList.add('opacity-0', 'invisible'); }
        });

        document.addEventListener("DOMContentLoaded", () => {
            fpInstance = flatpickr("#filterDate", {
                dateFormat: "Y-m-d",
                defaultDate: new Date(),
                allowInput: false,
                onChange: function() { renderTasks(); },
                onDayCreate: function(dObj, dStr, fp, dayElem) {
                    if (!allTasks || allTasks.length === 0) return;
                    const cellDate = dayElem.dateObj;
                    const offsetObj = new Date(cellDate.getTime() - cellDate.getTimezoneOffset() * 60000);
                    const dateKey = offsetObj.toISOString().split('T')[0];
                    const hasTasksOnDay = allTasks.some(t => {
                        const p = t.dateStr.split(" ")[0].split("/");
                        const taskIso = `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
                        return taskIso === dateKey;
                    });
                    if (hasTasksOnDay) { dayElem.classList.add("has-tasks-dot"); }
                }
            });
            loadSettings(); 
        });

        function showLoader(text = "معדכן נתונים...") {
            document.getElementById('loaderText').innerText = text;
            document.getElementById('loader').classList.remove('hidden');
        }
        function hideLoader() { document.getElementById('loader').classList.add('hidden'); }

        async function loadSettings() {
            try {
                const res = await fetch(`${API_URL}?action=getSettings`);
                const data = await res.json();
                workersPool = data.workers || [];
                updateWorkersSelectUI();
            } catch(e) { console.error("Ошибка загрузки настроек:", e); }
        }

        function updateWorkersSelectUI() {
            const sel = document.getElementById('printWorker');
            sel.innerHTML = '<option value="">בחר עובד... (Без мастера)</option>';
            workersPool.forEach(w => { sel.innerHTML += `<option value="${w}">${w}</option>`; });
        }

        function openWorkersModal() {
            document.getElementById('workersModal').classList.remove('hidden');
            renderWorkersListUI();
        }
        function closeWorkersModal() { document.getElementById('workersModal').classList.add('hidden'); }

        function renderWorkersListUI() {
            const zone = document.getElementById('workersListZone');
            zone.innerHTML = '';
            if(workersPool.length === 0) {
                zone.innerHTML = '<p class="text-center text-gray-400 p-4">אין עובדים ברשימה</p>';
                return;
            }
            workersPool.forEach((w, idx) => {
                zone.innerHTML += `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-200">
                    <span class="font-bold text-gray-700">${w}</span>
                    <button onclick="removeWorkerFromList(${idx})" class="text-red-500 hover:text-red-700 p-1"><i class="fas fa-trash-alt"></i></button>
                </div>`;
            });
        }

        function addWorkerToList() {
            const inp = document.getElementById('newWorkerName');
            const name = inp.value.trim();
            if(!name) return;
            if(workersPool.includes(name)) { showToast("עובד כבר קיים ברשימה!", "error"); return; }
            workersPool.push(name);
            inp.value = '';
            renderWorkersListUI();
        }

        function removeWorkerFromList(idx) {
            workersPool.splice(idx, 1);
            renderWorkersListUI();
        }

        async function saveWorkersToServer() {
            showLoader("שומר עובדים...");
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "SAVE_WORKERS", workers: workersPool })
                });
                const out = await res.json();
                if(out.status === "success") {
                    updateWorkersSelectUI();
                    closeWorkersModal();
                    showToast("רשימת העובדים עודכנה", "success");
                }
            } catch(e) { console.error(e); }
            hideLoader();
        }

        function checkPin() {
            if(document.getElementById('pinCode').value === "1234") { 
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                loadTasks();
            } else { document.getElementById('pinError').classList.remove('hidden'); }
        }

        function fixImageUrl(url) {
            if(!url) return "";
            let id = "";
            if(url.includes('id=')) id = url.split('id=')[1].split('&')[0];
            else if(url.includes('/d/')) id = url.split('/d/')[1].split('/')[0];
            return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : url;
        }

        function escapeStr(str) { return String(str || "").replace(/'/g, "\\'").replace(/"/g, "&quot;"); }

        function toggleBannerDetails() {
            const details = document.getElementById('bannerDetails');
            const chevron = document.getElementById('bannerChevron');
            if(details.classList.contains('hidden')) {
                details.classList.remove('hidden'); chevron.style.transform = 'rotate(180deg)';
            } else {
                details.classList.add('hidden'); chevron.style.transform = 'rotate(0deg)';
            }
        }

        async function loadTasks() {
            showLoader();
            try {
                const res = await fetch(`${API_URL}?action=getOpenTasks`);
                const data = await res.json();
                allTasks = data.tasks || [];
                if(fpInstance) fpInstance.redraw();
                renderTasks();
            } catch(e) { console.error("Ошибка загрузки:", e); }
            hideLoader();
        }

        function switchTab(t) { 
            currentTab = t; 
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'bg-white')); 
            const targetTab = document.getElementById('tab-'+t) || document.getElementById('tab-ליקויים');
            if(targetTab) targetTab.classList.add('active', 'bg-white'); 
            renderTasks(); 
        }

        function resetFilters() { 
            document.getElementById('filterDept').value="ALL"; 
            if(fpInstance) fpInstance.setDate(new Date());
            renderTasks(); 
        }

        function resetPrintStamp(realIdx) {
            const task = allTasks[realIdx];
            showCustomConfirm("ביטול סטטוס", "לבטל את סטטוס 'בעבודה' למשימה זו?", async () => {
                showLoader("מעדכן סטטוס...");
                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "UNMARK_PRINTED", tasks: [{ sheet: task.sheet, room: task.room, defect: task.defect, comment: task.comment || "", date: task.dateStr }] })
                    });
                    await loadTasks(); 
                    showToast("הסטטוס שונה ל'פתוח'", "success");
                } catch(e) { console.error(e); hideLoader(); }
            }, "fa-undo");
        }

        function toggleSelectAll() {
            const checkboxes = document.querySelectorAll('.task-checkbox:not(:disabled)');
            if (checkboxes.length === 0) return;
            const anyUnchecked = Array.from(checkboxes).some(cb => !cb.checked);
            checkboxes.forEach(cb => cb.checked = anyUnchecked);
            updateSelectAllBtn();
        }

        function updateSelectAllBtn() {
            const checkboxes = document.querySelectorAll('.task-checkbox:not(:disabled)');
            const btn = document.getElementById('selectAllBtn');
            if(!btn || checkboxes.length === 0) return;
            const anyUnchecked = Array.from(checkboxes).some(cb => !cb.checked);
            if (anyUnchecked) { btn.innerHTML = `<i class="fas fa-check-square ml-2"></i>בחר הכל`; } 
            else { btn.innerHTML = `<i class="fas fa-minus-square ml-2"></i>בטל בחירה`; }
        }

        function moveTask(realIdx, tgtSheet) {
            const task = allTasks[realIdx];
            if (!tgtSheet) return;
            showCustomConfirm("העברת משימה", "לשים לב: להעביר משימה זו לצוות אחר?", async () => {
                showLoader("מעביר...");
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST', body: JSON.stringify({ action: "MOVE_TASK", sourceSheet: task.sheet, targetSheet: tgtSheet, room: task.room, defect: task.defect, comment: task.comment || "" })
                    });
                    const out = await res.json();
                    if(out.status === "success") {
                        allTasks = allTasks.filter(t => t !== task);
                        if(fpInstance) fpInstance.redraw();
                        renderTasks();
                        showToast("המשימה הועברה בהצלחה", "success");
                    }
                } catch(e) { console.error(e); }
                hideLoader();
            }, "fa-exchange-alt");
        }

        function renderTasks() {
            const screen = document.getElementById('screenTasksContainer');
            const tbody = document.getElementById('managerTableBody');
            screen.innerHTML = ''; tbody.innerHTML = '';
            
            const fDept = document.getElementById('filterDept').value;
            const fDate = document.getElementById('filterDate').value;
            let now = new Date();

            let tasksForDeptFilter = allTasks; 
            if(fDate) {
                tasksForDeptFilter = tasksForDeptFilter.filter(t => {
                    const p = t.dateStr.split(" ")[0].split("/");
                    const taskIso = `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
                    return taskIso === fDate;
                });
            }
            const activeDepts = [...new Set(tasksForDeptFilter.map(t => t.dept))].filter(Boolean);
            
            const sel = document.getElementById('filterDept');
            const previousValue = sel.value;
            sel.innerHTML = '<option value="ALL">כל המחלקות</option>';
            activeDepts.forEach(d => sel.innerHTML += `<option value="${d}">${d}</option>`);
            if (activeDepts.includes(previousValue)) { sel.value = previousValue; }

            let filtered = allTasks.filter(t => t.sheet === currentTab);
            if(fDept !== "ALL") filtered = filtered.filter(t => t.dept === fDept);
            if(fDate) {
                filtered = filtered.filter(t => {
                    const p = t.dateStr.split(" ")[0].split("/");
                    const taskIso = `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
                    return taskIso === fDate;
                });
            }
            
            let unprintedList = []; let overdueList = [];
            let unprintedTaskCount = 0; let overdueTaskCount = 0;

            allTasks.forEach(t => {
                const isPrinted = (t.status === "בעבודה"); 
                const p = t.dateStr.split(" ")[0].split("/");
                const tm = t.dateStr.split(" ")[1] ? t.dateStr.split(" ")[1].split(":") : ["00","00"];
                const taskDate = new Date(p[2], p[1]-1, p[0], tm[0], tm[1]);
                const diffHours = (now.getTime() - taskDate.getTime()) / (1000 * 60 * 60);
                const dateOnly = t.dateStr.split(" ")[0];

                if (!isPrinted) {
                    unprintedTaskCount++;
                    let itemStr = `מחלקה: ${t.dept} | צוות: ${t.sheet} | תאריך: ${dateOnly}`;
                    if(!unprintedList.includes(itemStr)) unprintedList.push(itemStr);
                }
                if (diffHours >= 48) {
                    overdueTaskCount++;
                    let itemStr = `מחלקה: ${t.dept} | צוות: ${t.sheet} | תאריך: ${dateOnly}`;
                    if(!overdueList.includes(itemStr)) overdueList.push(itemStr);
                }
            });

            const banner = document.getElementById('unprintedAlertBanner');
            const bannerSummary = document.getElementById('bannerSummaryText');
            const bannerTextZone = document.getElementById('unprintedAlertText');

            if (unprintedTaskCount > 0 || overdueTaskCount > 0) {
                let summaryHTML = `<i class="fas fa-exclamation-triangle text-amber-500 text-lg"></i> <span>סיכום אזהרות:</span> `;
                if(unprintedTaskCount > 0) summaryHTML += `<span class="text-amber-700 font-black">${unprintedTaskCount} להדפסה</span>`;
                if(unprintedTaskCount > 0 && overdueTaskCount > 0) summaryHTML += `<span class="mx-2 text-gray-300">|</span>`;
                if(overdueTaskCount > 0) summaryHTML += `<span class="text-red-600 font-black">${overdueTaskCount} חריגות (48 שעות)!</span>`;
                bannerSummary.innerHTML = summaryHTML;

                let bannerHtml = `<div class="flex flex-col gap-4 text-right text-sm">`;
                if (unprintedList.length > 0) {
                    bannerHtml += `<div><p class="text-amber-900 font-bold mb-2 text-base border-b border-amber-200 pb-1"><i class="fas fa-print ml-2 text-amber-600"></i> ממתין להדפסה (לא יצא לעבודה):</p><ul class="list-disc list-inside text-gray-700 space-y-1 pr-2">${unprintedList.map(item => `<li>${item}</li>`).join('')}</ul></div>`;
                }
                if (overdueList.length > 0) {
                    bannerHtml += `<div class="${unprintedList.length > 0 ? 'border-t border-gray-200 pt-3' : ''}"><p class="text-red-800 font-bold mb-2 text-base border-b border-red-200 pb-1"><i class="fas fa-clock ml-2 text-red-600"></i> חריגת 48 שעות (פתוח מעл יומיים):</p><ul class="list-disc list-inside text-gray-700 space-y-1 pr-2">${overdueList.map(item => `<li>${item}</li>`).join('')}</ul></div>`;
                }
                bannerHtml += `</div>`; bannerTextZone.innerHTML = bannerHtml;
                banner.classList.remove('hidden');
            } else { banner.classList.add('hidden'); }

            if(filtered.length === 0) { 
                screen.innerHTML = '<p class="text-center p-10 text-gray-400 font-bold">אין משימות (Нет заданий)</p>'; 
                updateSelectAllBtn(); return; 
            }

            filtered.forEach((task) => {
                const actT = task.actionType == 1 ? "החלפה" : "תיקון";
                const img = fixImageUrl(task.photo);
                const isPrinted = (task.status === "בעבודה"); 
                const cleanSheetName = escapeStr(task.sheet).replace(/_/g, ' ');
                const realIdx = allTasks.indexOf(task);

                screen.innerHTML += `
                <div class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col md:flex-row gap-5 mb-4 relative ${isPrinted ? 'border-orange-300 bg-orange-50/30' : ''}" id="task-card-${realIdx}">
                    <div class="absolute top-4 left-4 md:static md:flex md:items-center">
                        <input type="checkbox" checked class="task-checkbox w-7 h-7 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer shadow-sm" data-index="${realIdx}" onchange="updateSelectAllBtn()">
                    </div>
                    <img src="${img}" class="w-24 h-24 object-cover rounded-xl border" onerror="this.src='https://placehold.co/100x100?text=No+Photo'">
                    <div class="flex-grow pr-10 md:pr-0">
                        <div class="inline-block bg-blue-50 text-blue-700 px-3 py-1 rounded-lg text-xs font-black mb-2 border border-blue-200 shadow-sm">
                            <i class="fas fa-users ml-1"></i> צוות נוכחי: ${cleanSheetName}
                        </div>
                        <div class="flex items-center gap-3">
                            <h3 class="text-xl font-bold">${task.dept} | חדר: ${task.room} <span class="text-sm font-normal px-2 bg-gray-100 rounded">${actT}</span></h3>
                            ${isPrinted ? `
                                <div class="flex items-center gap-2">
                                    <span class="in-progress-stamp text-xs font-black px-2 py-0.5 rounded uppercase tracking-wider">בעבודה / В работе</span>
                                    <button onclick="resetPrintStamp(${realIdx})" class="text-gray-400 hover:text-red-500 transition-colors p-1" title="בטל סטטוס / Сбросить"><i class="fas fa-undo"></i></button>
                                </div>
                            ` : ''}
                        </div>
                        <p class="font-bold mt-1">${task.defect}</p>
                        <p class="text-gray-500 text-sm">${task.comment || ""}</p>
                        <p class="text-xs text-gray-400 mt-1"><i class="fas fa-clock ml-1"></i>${task.dateStr}</p>
                    </div>
                    <div class="flex flex-row md:flex-col items-center justify-center gap-2">
                        <select onchange="moveTask(${realIdx}, this.value)" class="bg-gray-50 border border-gray-300 text-gray-700 py-2 px-3 rounded-xl font-bold text-sm outline-none cursor-pointer">
                            <option value="" disabled selected>העבר צוות...</option>
                            <option value="חשמל">חשמל (Электрика)</option>
                            <option value="מיזוג_אוויר">מיזוג (Кондиционирование)</option>
                            <option value="בינוי_ודלתות">בינוי (Строительство)</option>
                            <option value="מיטות">מיטות (Кровати)</option>
                            <option value="בטיחות">בטיחות (Безопасность)</option>
                            <option value="ניקיון">ניקיון (Уборка)</option>
                            <option value="ליקויים">כללי (Общие)</option>
                        </select>
                        <button id="btn-${realIdx}" onclick="closeSingleTask(${realIdx})" class="bg-green-50 text-green-600 border-2 border-green-500 px-6 py-2 rounded-xl font-bold w-full">בוצע</button>
                    </div>
                </div>`;

                tbody.innerHTML += `<tr>
                    <td>${task.dateStr}</td>
                    <td>${task.inspector || "אנדרי"}</td>
                    <td>${task.dept}</td>
                    <td>${task.room}</td>
                    <td>${task.defect}</td>
                    <td>${task.comment || ""}</td>
                    <td>${isPrinted ? "בעבודה" : "פתוח"}</td>
                </tr>`;
            });
            updateSelectAllBtn();
        }

        function closeSingleTask(realIdx) {
            const task = allTasks[realIdx];
            showCustomConfirm("סגירת משימה", "לסגור את המשימה הזו מהמערכת ומחיקת תמונה?", async () => {
                const b = document.getElementById(`btn-${realIdx}`);
                b.innerHTML = "..."; b.disabled = true;
                try {
                    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "CLOSE_TASK", sheetName: task.sheet, date: task.dateStr, room: task.room, defect: task.defect, comment: task.comment || "" }) });
                    const out = await res.json();
                    if(out.status === "success") {
                        document.getElementById(`task-card-${realIdx}`).style.opacity="0.3"; b.innerHTML = "סגור ✅";
                        allTasks = allTasks.filter(t => t !== task);
                        if(fpInstance) fpInstance.redraw();
                        setTimeout(renderTasks, 400);
                        showToast("המשימה נסגרה ונמחקה מהדרייב", "success");
                    }
                } catch(e) { b.disabled = false; b.innerHTML = "בוצע"; }
            }, "fa-check-circle");
        }

        // Защищенный метод группового закрытия карточек
        function closeSelectedTasks() {
            const checkboxes = document.querySelectorAll('.task-checkbox:checked:not(:disabled)');
            if(checkboxes.length === 0) { showToast("בחר לפחות משימה אחת!", "warning"); return; }
            
            showCustomConfirm("סגירת משימות", `לסגור את כל ${checkboxes.length} המשימות שנבחרו?`, async () => {
                showLoader("סוגר משימות...");
                
                // Сначала жёстко собираем ссылки на объекты, защищаясь от смещения индексов массива!
                const tasksToClose = [];
                checkboxes.forEach(cb => {
                    const idx = parseInt(cb.dataset.index);
                    if (allTasks[idx]) tasksToClose.push(allTasks[idx]);
                });

                for(let task of tasksToClose) {
                    try {
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "CLOSE_TASK", sheetName: task.sheet, date: task.dateStr, room: task.room, defect: task.defect, comment: task.comment || "" }) });
                        allTasks = allTasks.filter(t => t !== task);
                    } catch(e) { console.error(e); }
                }
                
                if(fpInstance) fpInstance.redraw();
                hideLoader(); 
                renderTasks();
                showToast("כל המשימות הנבחרות נסגרו בהצלחה", "success");
            }, "fa-check-double");
        }

        function printManagerReport() { 
            document.getElementById('noPrintUI').style.display = 'none';
            const printTitle = document.getElementById('printTitleManager');
            const printTable = document.getElementById('managerTable');
            const selDate = document.getElementById('filterDate').value || 'כל התאריכים';
            printTitle.innerText = `דוח מנהל - ${currentTab} (${selDate})`;
            printTitle.style.display = 'block'; printTable.style.display = 'table';
            setTimeout(() => { window.print(); document.getElementById('noPrintUI').style.display = 'block'; printTitle.style.display = 'none'; printTable.style.display = 'none'; }, 300); 
        }

        // Модуль проверки условий печати перед генерацией форм
        function printTasks() {
            const checkboxes = document.querySelectorAll('.task-checkbox:checked:not(:disabled)');
            if(checkboxes.length === 0) { showToast("אנא בחר כרטיסיות להדפסה!", "warning"); return; }

            const targetLang = document.getElementById('printLang').value; 
            const chosenWorker = document.getElementById('printWorker').value; 

            // Умная валидация: предупреждаем если не выбран язык (отличный от дефолта) или мастер
            if(!chosenWorker) {
                showCustomConfirm(
                    "הדפסה ללא מנהל עבודה", 
                    "שימו לב: לא נבחר עובד לביצוע. הטפסים יודפסו עם שדה חתימה ריק. האם להמשיך להדפסה?",
                    () => { executePrintSequence(checkboxes, targetLang, chosenWorker); },
                    "fa-print",
                    "הדפס בכל זאת",
                    "חזור לבחור"
                );
            } else {
                executePrintSequence(checkboxes, targetLang, chosenWorker);
            }
        }

        // Изолированная цепочка выполнения печати
        async function executePrintSequence(checkboxes, targetLang, chosenWorker) {
            let tasksToPrint = []; let tasksToUpdateOnServer = []; let translationPayload = [];

            checkboxes.forEach(cb => {
                const realIdx = parseInt(cb.dataset.index); const task = allTasks[realIdx];
                if (task) {
                    if (task.status !== "בעבודה") { 
                        tasksToUpdateOnServer.push({ sheet: task.sheet, room: task.room, defect: task.defect, comment: task.comment || "", date: task.dateStr }); 
                    }
                    const actT = task.actionType == 1 ? "החלפה" : "תיקון";
                    const img = fixImageUrl(task.photo); const dDate = task.dateStr.split(" ")[0];
                    let printTask = {...task, actT, img, dDate, id: realIdx};
                    if (targetLang !== 'he') { translationPayload.push({ id: realIdx, defect: task.defect, comment: task.comment, actT: actT }); }
                    tasksToPrint.push(printTask);
                }
            });

            let printLabels = { room: "חדר: ", name: "שם: ", date: "תאריך: ", sign: "חתימה: " };
            let textDirection = "rtl";

            if (targetLang !== 'he' && translationPayload.length > 0) {
                let loadLang = targetLang === 'ru' ? "מתרגם לרוסית..." : "מתרגם לערבית...";
                showLoader(loadLang);
                try {
                    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "TRANSLATE_TASKS", targetLang: targetLang, tasks: translationPayload }) });
                    const transData = await res.json();
                    if (transData.status === "success" && transData.translations) {
                        transData.translations.forEach(transItem => {
                            let matchTask = tasksToPrint.find(t => t.id === transItem.id);
                            if (matchTask) { matchTask.defect = transItem.defect; matchTask.comment = transItem.comment; matchTask.actT = transItem.actT; }
                        });
                        printLabels = transData.translations[0].labels; textDirection = (targetLang === 'ru') ? "ltr" : "rtl"; 
                    }
                } catch (e) { console.error(e); }
                hideLoader();
            }

            if (tasksToUpdateOnServer.length > 0) {
                showLoader("מכין להדפסה...");
                try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "MARK_PRINTED", tasks: tasksToUpdateOnServer }) }); } catch(e) {}
                hideLoader();
            }

            const printNow = new Date();
            const printNowStr = printNow.toLocaleDateString('en-GB') + ' ' + printNow.toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit'});

            let groups = {};
            tasksToPrint.forEach(task => {
                let key = `${task.dept}|${task.dDate}`;
                if(!groups[key]) groups[key] = []; groups[key].push(task);
            });

            const printContainer = document.getElementById('printTasksContainer');
            printContainer.innerHTML = '';

            for(let key in groups) {
                let g = groups[key];
                for(let i=0; i<g.length; i+=4) {
                    let chunk = g.slice(i, i+4);
                    let page = `<div class="print-page">
                        <div class="print-page-header">
                            <div>צוות: ${currentTab.replace(/_/g, ' ')} | מחלקה: ${g[0].dept} | תאריך ביקורת: ${g[0].dDate}</div>
                            <div class="print-page-header-sub">הודפס בתאריך: ${printNowStr}</div>
                        </div>
                        <div class="print-cards-grid">`;
                    
                    chunk.forEach(t => {
                        let nameVal = chosenWorker ? `<strong>${chosenWorker}</strong>` : "_________";
                        page += `
                        <div class="print-card" dir="${textDirection}">
                            <div class="print-card-top"><span class="font-black text-xl">${printLabels.room} ${t.room}</span><span class="px-2 border rounded">${t.actT}</span></div>
                            <div class="print-card-body">
                                <img src="${t.img}" class="print-photo" onerror="this.style.display='none'">
                                <div class="print-info">
                                    <p class="defect-title">${t.defect}</p>
                                    <p class="defect-comment">${t.comment || ""}</p>
                                </div>
                            </div>
                            <div class="signature-box" dir="${textDirection}">
                                <span>${printLabels.name} ${nameVal}</span>
                                <span>${printLabels.date} _________</span>
                                <span>${printLabels.sign} _________</span>
                            </div>
                        </div>`;
                    });
                    printContainer.innerHTML += page + `</div></div>`;
                }
            }

            document.getElementById('noPrintUI').style.display = 'none';
            printContainer.style.display = 'block';
            setTimeout(() => { window.print(); document.getElementById('noPrintUI').style.display = 'block'; printContainer.style.display = 'none'; loadTasks(); }, 300); 
        }
    </script>
</body>
</html>
