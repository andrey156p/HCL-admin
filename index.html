<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HCL Admin - לוח בקרה</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f2937">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="admin-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .tab-btn.active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: bold; background-color: white;}
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Стили для штампа "В работе" */
        .in-progress-stamp { border: 3px solid #f97316; color: #f97316; transform: rotate(-5deg); font-family: 'Impact', sans-serif; }

        @media screen { .print-only { display: none !important; } }

        @media print {
            @page { size: A4 portrait; margin: 5mm; }
            body { background: white; margin: 0; padding: 0 !important; -webkit-print-color-adjust: exact; }
            .no-print { display: none !important; }
            
            #managerTable, #printTitleManager, #printTasksContainer { display: none !important; }
            body.task-print-mode #printTasksContainer { display: block !important; }

            .print-page { width: 100%; height: 282mm; page-break-after: always; box-sizing: border-box; padding: 5mm; display: flex; flex-direction: column; }
            .print-page-header { font-size: 19px; font-weight: bold; text-align: center; border-bottom: 3px solid #000; padding-bottom: 5px; margin-bottom: 10px; height: 30px; }
            .print-cards-grid { display: flex; flex-wrap: wrap; justify-content: space-between; align-content: space-between; height: calc(100% - 40px); }
            .print-card { width: 48.8%; height: 48.8%; border: 2px solid #000; border-radius: 10px; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; page-break-inside: avoid; overflow: hidden; }
            .print-card-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 5px; margin-bottom: 10px; }
            .print-card-body { display: flex; gap: 15px; flex-grow: 1; align-items: flex-start; }
            .print-photo { width: 60%; height: 280px; object-fit: cover; border: 2px solid #cbd5e1; border-radius: 8px; }
            .print-info { width: 40%; display: flex; flex-direction: column; }
            .defect-title { font-size: 20px; font-weight: 900; margin-bottom: 8px; }
            .defect-comment { font-size: 15px; color: #374151; }
            .signature-box { border-top: 2px dashed #000; margin-top: auto; padding-top: 5px; display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; }

            body.manager-report-mode #managerTable { display: table !important; width: 100%; border-collapse: collapse; margin-top: 10mm; }
            body.manager-report-mode #printTitleManager { display: block !important; font-size: 24px; font-weight: bold; text-align: center; text-decoration: underline; margin-top: 10mm; margin-bottom: 10mm; }
            body.manager-report-mode th, body.manager-report-mode td { border: 1px solid #000; padding: 8px; text-align: right; }
            body.manager-report-mode th { background: #f3f4f6; font-size: 15px; }
        }
    </style>
</head>
<body class="text-gray-800">

    <div id="loginScreen" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50 no-print">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center">
            <i class="fas fa-lock text-indigo-600 text-5xl mb-4"></i>
            <h2 class="text-2xl font-black mb-6">כניסת מנהל</h2>
            <input type="password" id="pinCode" placeholder="קוד גישה" class="w-full p-4 mb-4 bg-gray-50 border rounded-xl text-center text-2xl font-bold tracking-widest outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="checkPin()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg">כניסה</button>
            <p id="pinError" class="text-red-500 font-bold mt-2 hidden">קוד שגוי!</p>
        </div>
    </div>

    <div id="loader" class="fixed inset-0 bg-white/90 hidden z-40 flex items-center justify-center no-print">
        <div class="flex flex-col items-center"><div class="loader mb-4"></div><p class="font-bold text-indigo-600">מעדכן נתונים...</p></div>
    </div>

    <div id="mainApp" class="hidden max-w-5xl mx-auto p-4 md:p-6 print:p-0 print:max-w-full">
        
        <div id="unprintedAlertBanner" class="hidden bg-amber-50 border-r-4 border-amber-500 p-4 rounded-xl mb-6 flex justify-between items-center shadow-sm no-print">
            <div class="flex items-center gap-3">
                <i class="fas fa-exclamation-circle text-amber-600 text-xl"></i>
                <p class="font-bold text-amber-900" id="unprintedAlertText"></p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-6 no-print">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 border-b pb-4">
                <h1 class="text-3xl font-black text-gray-800 mb-4 md:mb-0">לוח בקרה <span class="text-indigo-600">HCL</span></h1>
                <div class="flex gap-2 flex-wrap justify-center">
                    <button onclick="closeSelectedTasks()" class="bg-indigo-600 text-white px-5 py-2 rounded-xl font-bold hover:bg-indigo-500 shadow"><i class="fas fa-check-double ml-2"></i>סגור נבחרים</button>
                    <button onclick="printTasks()" class="bg-orange-600 text-white px-5 py-2 rounded-xl font-bold hover:bg-orange-500 shadow"><i class="fas fa-print ml-2"></i>הדפסת כרטיסיות</button>
                    <button onclick="printManagerReport()" class="bg-green-600 text-white px-5 py-2 rounded-xl font-bold hover:bg-green-500"><i class="fas fa-table ml-2"></i>דוח מנהל</button>
                    <button onclick="loadTasks()" class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-xl font-bold hover:bg-indigo-200"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <label class="block text-sm font-bold text-gray-500 mb-1">מחלקה</label>
                    <select id="filterDept" onchange="renderTasks()" class="w-full p-3 bg-gray-50 border rounded-xl font-bold outline-none">
                        <option value="ALL">כל המחלקות</option>
                    </select>
                </div>
                <div class="flex-1">
                    <label class="block text-sm font-bold text-gray-500 mb-1">מתאריך</label>
                    <input type="date" id="filterDate" onchange="renderTasks()" class="w-full p-3 bg-gray-50 border rounded-xl font-bold outline-none">
                </div>
                <div class="flex items-end">
                    <button onclick="resetFilters()" class="px-6 py-3 bg-red-100 text-red-600 rounded-xl font-bold">נקה סינון</button>
                </div>
            </div>
        </div>

        <div class="flex bg-white rounded-2xl shadow-sm mb-6 overflow-hidden no-print flex-wrap md:flex-nowrap">
            <button onclick="switchTab('חשמל')" id="tab-חשמל" class="tab-btn active flex-1 py-4 px-2 font-bold text-gray-500">חשמל</button>
            <button onclick="switchTab('מיזוג_אוויר')" id="tab-מיזוג_אוויר" class="tab-btn flex-1 py-4 px-2 font-bold text-gray-500">מיזוג</button>
            <button onclick="switchTab('בינוי_ודלתות')" id="tab-בינוי_ודלתות" class="tab-btn flex-1 py-4 px-2 font-bold text-gray-500">בינוי</button>
            <button onclick="switchTab('מיטות')" id="tab-מיטות" class="tab-btn flex-1 py-4 px-2 font-bold text-gray-500">מיטות</button>
            <button onclick="switchTab('בטיחות')" id="tab-בטיחות" class="tab-btn flex-1 py-4 px-2 font-bold text-gray-500">בטיחות</button>
            <button onclick="switchTab('ליקויים')" id="tab-ליקויים" class="tab-btn flex-1 py-4 px-2 font-bold text-gray-500">כללי</button>
        </div>

        <div class="print-only" id="printTitleManager"></div>
        <table id="managerTable" class="print-only">
            <thead>
                <tr><th>תאריך</th><th>מחלקה</th><th>חדר</th><th>ליקוי</th><th>פעולה</th><th>אישור</th></tr>
            </thead>
            <tbody id="managerTableBody"></tbody>
        </table>

        <div id="screenTasksContainer" class="space-y-4 no-print"></div>
        <div id="printTasksContainer" class="print-only"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxMN6s8ektwhHxuE_8xDz1ZaeqYyXaLyniwi_xFpbzVEjFEo_AUd6PybJk6nGKxmy7E/exec";
        let allTasks = [];
        let currentTab = "חשמל";

        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('filterDate').value = today;
        });

        function checkPin() {
            if(document.getElementById('pinCode').value === "1234") { 
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                loadTasks();
            } else { document.getElementById('pinError').classList.remove('hidden'); }
        }

        function fixImageUrl(url) {
            if(!url) return "";
            let id = "";
            if(url.includes('id=')) id = url.split('id=')[1].split('&')[0];
            else if(url.includes('/d/')) id = url.split('/d/')[1].split('/')[0];
            return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : url;
        }

        function escapeStr(str) { return String(str || "").replace(/'/g, "\\'").replace(/"/g, "&quot;"); }

        function makeTaskKey(task) {
            return `${task.sheet}_${task.dateStr}_${task.room}_${task.defect}`.replace(/\s+/g, '_');
        }

        async function loadTasks() {
            document.getElementById('loader').classList.remove('hidden');
            try {
                const res = await fetch(`${API_URL}?action=getOpenTasks`);
                const data = await res.json();
                allTasks = data.tasks || [];
                
                renderTasks();
            } catch(e) { console.error("Ошибка загрузки:", e); }
            document.getElementById('loader').classList.add('hidden');
        }

        function switchTab(t) { 
            currentTab = t; 
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'bg-white')); 
            const targetTab = document.getElementById('tab-'+t) || document.getElementById('tab-ליקויים');
            if(targetTab) targetTab.classList.add('active', 'bg-white'); 
            renderTasks(); 
        }

        function resetFilters() { 
            document.getElementById('filterDept').value="ALL"; 
            document.getElementById('filterDate').value=""; 
            renderTasks(); 
        }

        // НОВАЯ ФУНКЦИЯ: Сброс штампа "В работе"
        function resetPrintStamp(tKey) {
            if(!confirm("לבטל את סטטוס 'בעבודה' למשימה זו?")) return;
            let printedKeys = JSON.parse(localStorage.getItem('hcl_printed_tasks') || "[]");
            printedKeys = printedKeys.filter(k => k !== tKey);
            localStorage.setItem('hcl_printed_tasks', JSON.stringify(printedKeys));
            renderTasks();
        }

        function renderTasks() {
            const screen = document.getElementById('screenTasksContainer');
            const print = document.getElementById('printTasksContainer');
            const tbody = document.getElementById('managerTableBody');
            screen.innerHTML = ''; print.innerHTML = ''; tbody.innerHTML = '';
            
            const fDept = document.getElementById('filterDept').value;
            const fDate = document.getElementById('filterDate').value;

            let printedKeys = JSON.parse(localStorage.getItem('hcl_printed_tasks') || "[]");

            let tasksForDeptFilter = allTasks.filter(t => t.sheet === currentTab);
            if(fDate) {
                const selD = new Date(fDate);
                tasksForDeptFilter = tasksForDeptFilter.filter(t => {
                    const p = t.dateStr.split(" ")[0].split("/");
                    return new Date(`${p[2]}-${p[1]}-${p[0]}`).toDateString() === selD.toDateString();
                });
            }
            const activeDepts = [...new Set(tasksForDeptFilter.map(t => t.dept))].filter(Boolean);
            
            const sel = document.getElementById('filterDept');
            const previousValue = sel.value;
            sel.innerHTML = '<option value="ALL">כל המחלקות</option>';
            activeDepts.forEach(d => sel.innerHTML += `<option value="${d}">${d}</option>`);
            if (activeDepts.includes(previousValue)) { sel.value = previousValue; }

            let filtered = allTasks.filter(t => t.sheet === currentTab);
            if(fDept !== "ALL") filtered = filtered.filter(t => t.dept === fDept);
            if(fDate) {
                const selD = new Date(fDate);
                filtered = filtered.filter(t => {
                    const p = t.dateStr.split(" ")[0].split("/");
                    return new Date(`${p[2]}-${p[1]}-${p[0]}`).toDateString() === selD.toDateString();
                });
            }
            
            let unprintedCount = filtered.filter(t => !printedKeys.includes(makeTaskKey(t))).length;
            const banner = document.getElementById('unprintedAlertBanner');
            if (unprintedCount > 0 && fDate) {
                document.getElementById('unprintedAlertText').innerText = `⚠️ שים לב: ישנן ${unprintedCount} תקלות שלא הודפסו ולא יצאו לעבודה ליום זה!`;
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }

            if(filtered.length === 0) { 
                screen.innerHTML = '<p class="text-center p-10 text-gray-400 font-bold">אין משימות (Нет заданий)</p>'; 
                return; 
            }

            let groups = {};
            filtered.forEach((task, idx) => {
                const actT = task.actionType == 1 ? "החלפה" : "תיקון";
                const img = fixImageUrl(task.photo);
                const dDate = task.dateStr.split(" ")[0];
                const tKey = makeTaskKey(task);
                const isPrinted = printedKeys.includes(tKey);
                
                const safeSheet = escapeStr(task.sheet);
                const safeDateStr = escapeStr(task.dateStr);
                const safeRoom = escapeStr(task.room);
                const safeDefect = escapeStr(task.defect);

                screen.innerHTML += `
                <div class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col md:flex-row gap-5 mb-4 relative ${isPrinted ? 'border-orange-300 bg-orange-50/30' : ''}" id="task-card-${idx}">
                    <div class="absolute top-4 left-4 md:static md:flex md:items-center">
                        <input type="checkbox" class="task-checkbox w-7 h-7 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer shadow-sm" 
                               data-index="${idx}" data-key="${tKey}" data-sheet="${safeSheet}" data-date="${safeDateStr}" data-room="${safeRoom}" data-defect="${safeDefect}">
                    </div>
                    <img src="${img}" class="w-24 h-24 object-cover rounded-xl border" onerror="this.src='https://placehold.co/100x100?text=No+Photo'">
                    <div class="flex-grow pr-10 md:pr-0">
                        <div class="flex items-center gap-3">
                            <h3 class="text-xl font-bold">${task.dept} | חדר: ${task.room} <span class="text-sm font-normal px-2 bg-gray-100 rounded">${actT}</span></h3>
                            ${isPrinted ? `
                                <div class="flex items-center gap-2">
                                    <span class="in-progress-stamp text-xs font-black px-2 py-0.5 rounded uppercase tracking-wider">בעבודה / В работе</span>
                                    <button onclick="resetPrintStamp('${tKey}')" class="text-gray-400 hover:text-red-500 transition-colors no-print p-1" title="בטל סטטוס / Сбросить">
                                        <i class="fas fa-undo"></i>
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                        <p class="font-bold mt-1">${task.defect}</p>
                        <p class="text-gray-500 text-sm">${task.comment || ""}</p>
                    </div>
                    <button id="btn-${idx}" onclick="closeTask('${safeSheet}','${safeDateStr}','${safeRoom}','${safeDefect}', ${idx}, '${tKey}')" class="bg-green-50 text-green-600 border-2 border-green-500 px-6 py-3 rounded-xl font-bold">בוצע</button>
                </div>`;

                tbody.innerHTML += `<tr><td>${dDate}</td><td>${task.dept}</td><td>${task.room}</td><td>${task.defect}</td><td>${actT}</td><td></td></tr>`;

                let key = `${task.dept}|${dDate}`;
                if(!groups[key]) groups[key] = [];
                groups[key].push({...task, actT, img});
            });

            for(let key in groups) {
                let g = groups[key];
                for(let i=0; i<g.length; i+=4) {
                    let chunk = g.slice(i, i+4);
                    let page = `<div class="print-page"><div class="print-page-header">צוות: ${currentTab} | מחלקה: ${g[0].dept} | תאריך: ${g[0].dateStr.split(" ")[0]}</div><div class="print-cards-grid">`;
                    chunk.forEach(t => {
                        page += `<div class="print-card">
                            <div class="print-card-top"><span class="font-black text-xl">חדר: ${t.room}</span><span class="px-2 border rounded">${t.actT}</span></div>
                            <div class="print-card-body">
                                <img src="${t.img}" class="print-photo" onerror="this.style.display='none'">
                                <div class="print-info"><p class="defect-title">${t.defect}</p><p class="defect-comment">${t.comment || ""}</p></div>
                            </div>
                            <div class="signature-box"><span>שם: _________</span><span>תאריך: _________</span><span>חתימה: _________</span></div>
                        </div>`;
                    });
                    print.innerHTML += page + `</div></div>`;
                }
            }
        }

        async function closeTask(sh, dt, rm, df, idx, tKey) {
            if(!confirm("לסגור את המשימה?")) return;
            const b = document.getElementById(`btn-${idx}`);
            b.innerHTML = "..."; b.disabled = true;
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "CLOSE_TASK", sheetName: sh, date: dt, room: rm, defect: df }) });
                const out = await res.json();
                if(out.status === "success") {
                    document.getElementById(`task-card-${idx}`).style.opacity="0.3";
                    b.innerHTML = "סגור ✅";
                    const cb = document.querySelector(`.task-checkbox[data-index="${idx}"]`);
                    if(cb) { cb.checked = false; cb.disabled = true; }
                    
                    let printedKeys = JSON.parse(localStorage.getItem('hcl_printed_tasks') || "[]");
                    printedKeys = printedKeys.filter(k => k !== tKey);
                    localStorage.setItem('hcl_printed_tasks', JSON.stringify(printedKeys));

                    allTasks = allTasks.filter(t => !(t.sheet === sh && t.dateStr === dt && t.room == rm && t.defect === df));
                    setTimeout(renderTasks, 500);
                }
            } catch(e) { b.disabled = false; b.innerHTML = "בוצע"; }
        }

        async function closeSelectedTasks() {
            const checkboxes = document.querySelectorAll('.task-checkbox:checked:not(:disabled)');
            if(checkboxes.length === 0) { alert("בחר לפחות משימה אחת!"); return; }
            if(!confirm(`לסגור ${checkboxes.length} משימות?`)) return;
            
            document.getElementById('loader').classList.remove('hidden');
            let printedKeys = JSON.parse(localStorage.getItem('hcl_printed_tasks') || "[]");

            for(let cb of checkboxes) {
                const idx = cb.dataset.index;
                const sh = cb.dataset.sheet;
                const dt = cb.dataset.date;
                const rm = cb.dataset.room;
                const df = cb.dataset.defect;
                const tKey = cb.dataset.key;
                try {
                    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "CLOSE_TASK", sheetName: sh, date: dt, room: rm, defect: df }) });
                    const out = await res.json();
                    if(out.status === "success") {
                        printedKeys = printedKeys.filter(k => k !== tKey);
                        allTasks = allTasks.filter(t => !(t.sheet === sh && t.dateStr === dt && t.room == rm && t.defect === df));
                    }
                } catch(e) { console.error(e); }
            }
            localStorage.setItem('hcl_printed_tasks', JSON.stringify(printedKeys));
            document.getElementById('loader').classList.add('hidden');
            loadTasks();
        }

        function printTasks() { 
            const checkboxes = document.querySelectorAll('.task-checkbox:checked:not(:disabled)');
            if(checkboxes.length === 0) { alert("אנא בחר כרטיסיות להדפסה!"); return; }

            let printedKeys = JSON.parse(localStorage.getItem('hcl_printed_tasks') || "[]");
            checkboxes.forEach(cb => {
                const tKey = cb.dataset.key;
                if (!printedKeys.includes(tKey)) { printedKeys.push(tKey); }
            });
            localStorage.setItem('hcl_printed_tasks', JSON.stringify(printedKeys));

            document.body.classList.remove('manager-report-mode'); 
            document.body.classList.add('task-print-mode'); 
            
            setTimeout(() => { 
                window.print(); 
                renderTasks(); 
            }, 200); 
        }

        function printManagerReport() { document.body.classList.remove('task-print-mode'); document.body.classList.add('manager-report-mode'); document.getElementById('printTitleManager').innerText = `דוח מנהל - ${currentTab}`; setTimeout(() => { window.print(); }, 200); }
        window.addEventListener('afterprint', () => { document.body.classList.remove('task-print-mode','manager-report-mode'); });
    </script>
</body>
</html>
